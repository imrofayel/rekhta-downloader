[package]
name = "rekhta"
version = "0.1.0"
description = "Rekhta Book Downloader"
authors = ["naveed-azhar"]
edition = "2021"

[lib]
name = "rekhta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP & async
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "http2"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Scraping & parsing
regex = "1"
anyhow = "1"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1"
num_cpus = "1"

# PDF generation — lopdf for raw JPEG embedding (no decode/re-encode)
lopdf = "0.35"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
